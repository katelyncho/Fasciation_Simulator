<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fasciation Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="meadow" aria-hidden="true"></canvas>
  <div id="cam-panel">
    <canvas id="cam-preview" hidden aria-label="Webcam preview with face landmarks"></canvas>
    <video id="cam" autoplay playsinline muted></video>
  </div>
  <main>
    <div id="status" aria-live="polite" hidden></div>
    <div class="controls" id="controls">
      <button data-action="grow">Cut and Regrow</button>
    </div>
    
    <div class="player">
      <canvas id="flower" width="128" height="128" aria-label="Animated pixel daisy">
      </canvas>
    </div>
    
  </main>
  <script src="script.js"></script>
  <script type="module" src="face.js"></script>
</body>
</html>
