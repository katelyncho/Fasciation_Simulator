<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fasciation Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <button id="cam-btn">Camera</button>

  <canvas id="meadow" aria-hidden="true"></canvas>
  <main>
    <div id="status" aria-live="polite"></div>
    <div class="controls" id="controls">
      <button data-state="idle" class="on">Idle</button>
      <button data-state="state1">State 1</button>
      <button data-state="state2">State 2</button>
      <button data-state="stem">Stem</button>
      <button data-action="grow">Grow</button>
    </div>
    
    <div class="player">
      <canvas id="flower" width="128" height="128" aria-label="Animated pixel daisy">
      </canvas>
    </div>
    
  </main>
  <script src="script.js"></script>
</body>
</html>
